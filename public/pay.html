<script>
const INV_ID = location.pathname.split('/').filter(Boolean).pop();
const PUB = '/v1/payment/public/' + encodeURIComponent(INV_ID);
const M2ID = { bKash:'bkash', Nagad:'nagad', Upay:'upay', Rocket:'rocket' };
let INV = null, PAID = false;
const API = {
  async load() { return (await fetch(PUB)).json(); },

  async createSession({method}) {
    const m = INV.available_methods.find(x => x.id === M2ID[method]);
    return m ? { ok:true, invoice:INV.invoice_id, adminNumber:m.receiver_number } : { ok:false };
  },

  async cancel() {
    try {
      const r = await fetch(PUB, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'cancel' }) });
      const j = await r.json();
      return j.success ? { ok:true } : { ok:false, msg:(j.message || 'Error') };
    } catch (e) {
      return { ok:false, msg:'Network error. Please try again.' };
    }
  },
  async verify({trxId, method, sender}) {
    try {
      const r = await fetch(PUB, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ payment_method:M2ID[method], sender_number:sender, transaction_id:trxId }) });
      const j = await r.json();
      if (j.success) {
        const d = j.data;
        return { ok:true, trxId:d.transaction_id, amount:d.amount, method, sender:d.sender_number,
                 paidAt:fmtPaidAt(d.verified_at) };
      }
      const c = j.error && j.error.code;
      const left = typeof j.attempts_left === 'number' ? j.attempts_left : null;
      if (c === 'SUPPORT_REQUIRED' || r.status === 429) return { ok:false, code:'LOCKED', left:0 };
      if (c === 'DUPLICATE_TRANSACTION') return { ok:false, code:'USED', left };
      if (j.status === 'failed') return { ok:false, code:'NOT_FOUND', left };
      const det = (j.error && j.error.details) ? ' (' + j.error.details + ')' : '';
      return { ok:false, code:c || 'ERROR', msg:esc((j.message || 'Error') + det) };
    } catch (e) {
      return { ok:false, code:'NETWORK', msg:'Network error. Please try again.' };
    }
  }
};

function show(id){
  ['s1','s2','s3','s4'].forEach(s => $(s).classList.add('hidden'));

}

  all('.amtText').forEach(e => e.textContent = state.amount);

  success:'<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg>',

};
const esc = v => String(v).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');

function dialog({type, title, text = '', html = '', ok = true, timer = 0, dismiss = true}){
  return new Promise(resolve => {
    const d = $('dlg'), c = $('dlgCard');
    let closed = false;
    const close = () => {
      if (closed) return; closed = true;
      d.classList.add('out');
      setTimeout(() => { d.classList.add('hidden'); resolve(); }, 180);
    };
    window._dlgClose = close;
    c.className = 'dlg-card ' + type;
    c.innerHTML = `<div class="dlg-ico">${ICONS[type]}</div><h3>${title}</h3>${html || `<p>${text}</p>`}` +
      (ok ? `<button class="dlg-ok${typeof ok === 'string' ? ' wide' : ''}">${typeof ok === 'string' ? ok : t('ok')}</button>` : '') +
      (timer ? `<i class="dlg-bar" style="animation-duration:${timer}ms"></i>` : '');
    d.onclick = e => { if (dismiss && e.target === d) close(); };
    const b = c.querySelector('.dlg-ok');
    if (b){ b.onclick = close; }
    if (timer) setTimeout(close, timer);
    d.classList.remove('hidden', 'out');
    if (b) b.focus();
  });
}
const alertSuccess = (title, html) => dialog({type:'success', title, html, dismiss:false});

function btnLoad(btn, label){

});

async function cancelSession(){
  const btn = $('gwCancel'), okBtn = $('gwOk');
  if (btn.disabled) return;
  const okWas = okBtn.disabled;
  okBtn.disabled = true; btnLoad(btn);
  const r = await API.cancel();
  if (r.ok) return showCancelled();
  btnDone(btn); okBtn.disabled = okWas;
  showTopMsg(r.msg);
}

function backUrl(){
  const ok = u => typeof u === 'string' && /^https?:\/\//i.test(u);
  const u = INV && (INV.cancel_url || INV.website_url);
  if (ok(u)) return u;
  try { const r = document.referrer; if (ok(r) && new URL(r).origin !== location.origin) return r; } catch (e) {}
  return '';
}

function showCancelled(){
  const url = backUrl();
  const html = `<p>${t('cancelMsg')}</p>` + (url ? `<p class="redir">${DOTS}<span>${t('backing')}</span></p>` : '');
  dialog({type:'error', title:t('cancelTitle'), html, ok:false, dismiss:false, timer: url ? 1800 : 0})
    .then(() => { if (url) location.replace(url); });
}
function step2Next(){
  const p = $('phoneInput').value.trim(), h = $('phoneHint');
  if (!PHONE_OK.test(p)){
    h.textContent = t('phoneErr'); h.classList.add('err');
    return;
  }
  state.sender = p;
  preparePaymentPage(); show('s4'); window.scrollTo(0,0);
}

async function pickMethod(m){
  state.method = m;
  const cards = all('#methodsGrid .pay-card'); cards.forEach(c => c.disabled = true);
  const card = Array.from(cards).find(c => c.querySelector('img').alt === m);
  card.classList.add('is-loading'); card.insertAdjacentHTML('beforeend', DOTS);
  const res = await API.createSession({amount:state.amount, method:m, sender:''});
  card.classList.remove('is-loading'); card.querySelector('.dots').remove();
  cards.forEach(c => c.disabled = false);
  state.invoice = res.invoice; state.adminNumber = res.adminNumber;
  $('gw').className = 'gw ' + CLS[m];
  $('gwLogo').alt = m; $('gwLogo').src = LOGOS[m];
  setNames();
  $('gwInv').textContent = state.invoice;
  $('gwTitle').textContent = t('acctTitle')(m);
  $('phoneInput').value = ''; $('gwOk').disabled = true; resetPhoneHint();
  fillText(); show('s2'); window.scrollTo(0,0);
  setTimeout(()=>$('phoneInput').focus(),100);
}

  fillText();

}

let PANEL = '', TAB = 'mobile';

function openPanel(k){ PANEL = PANEL === k ? '' : k; renderPanel(); }
function renderPanel(){
  const p = $('panel');
  all('.quick-icons button').forEach(b => b.classList.toggle('on', b.dataset.k === PANEL));
  $('methodsGrid').classList.toggle('hidden', !!PANEL || TAB !== 'mobile');

document.addEventListener('click', e => {

function supportHTML(){

}
function faqHTML(){

}
const HL_BN = /\*?\d+#|[A-Za-z][A-Za-z0-9]*(?:-[A-Za-z0-9]+)*(?:\s+[A-Za-z][A-Za-z0-9]*(?:-[A-Za-z0-9]+)*)*/g;
const HL_EN = /\*?\d+#|bKash|Nagad|Upay|Rocket|Send Money|confirmation SMS|Transaction ID|TrxID|Verify Payment/gi;
function hl(s){
  return s.split(/(<[^>]+>)/).map(p => p.startsWith('<') ? p :
    p.replace(LANG === 'bn' ? HL_BN : HL_EN, m => `<span class="en">${m}</span>`)
  ).join('');
}
function stepsHTML(){
  const m = state.method, d = I18N[LANG];

    </div></div>

    <div class="row"><span>•</span><p>${hl(d.sent[m])}</p></div>
    <div class="row"><span>•</span><p>${hl(d.final)}</p></div>`;
}
async function copyText(v){
  try{ if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(v); return true; } }catch(e){}
  try{
    const a = document.createElement('textarea'); a.value = v; a.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(a); a.select(); a.setSelectionRange(0,99);
    const r = document.execCommand('copy'); a.remove(); return r;
  }catch(e){ return false; }
}
async function copyNum(btn){
  if (!(await copyText(state.adminNumber.replace(/\D/g,'')))) return;
  btn.classList.add('done'); btn.innerHTML = '<i class="fa-solid fa-check"></i>';
  clearTimeout(btn._t);
  btn._t = setTimeout(()=>{ btn.classList.remove('done'); btn.innerHTML = '<i class="fa-regular fa-copy"></i>'; }, 2000);
}
async function copyInv(btn){
  if (!(await copyText(state.invoice))) return;
  btn.classList.add('done'); btn.innerHTML = '<i class="fa-solid fa-check"></i>';
  clearTimeout(btn._t);
  btn._t = setTimeout(()=>{ btn.classList.remove('done'); btn.innerHTML = '<i class="fa-solid fa-copy"></i>'; }, 1800);
}
async function verify(){
  const trxId = $('trxInput').value.trim().toUpperCase();
  if (!trxId){ await alertWarn(t('oops'), t('needTrx')); $('trxInput').focus(); return; }
  const btn = $('verifyBtn'), inp = $('trxInput'); inp.disabled = true; btnLoad(btn, t('verifying'));
  const res = await API.verify({invoice:state.invoice, trxId, amount:state.amount, method:state.method, sender:state.sender});
  inp.disabled = false; btnDone(btn); btn.textContent = t('verify');
  showResult(res);
}

function lockVerify(){
  const msg = encodeURIComponent('Invoice: ' + state.invoice + '\nTrxID: ' + ($('trxInput').value.trim().toUpperCase() || '-'));
  const wa = CONTACTS.find(c => c.label === 'WhatsApp'), tg = CONTACTS.find(c => c.label === 'Telegram');
  const row = (c, href) => `<a class="contact" href="${href}" target="_blank" rel="noopener"><span class="c-ic" style="--k:${c.c}"><i class="${c.ic}"></i></span><span class="c-tx"><small>${c.label} Support</small><b>${esc(c.val)}</b></span><i class="fa-solid fa-chevron-right c-go"></i></a>`;
  $('supportBox').innerHTML = `<div class="pcard sup"><p style="text-align:center;margin:2px 0 10px">${t('supMsg')}</p>` + row(wa, wa.href + '?text=' + msg) + row(tg, tg.href) + '</div>';
  $('supportBox').classList.remove('hidden');
  $('verifyBtn').classList.add('hidden');
  $('trxInput').value = '';
  $('trxInput').disabled = true;
}
function showResult(r){
  if (r.ok){
    PAID = true; LAST = { amount:r.amount, method:r.method, invoice:state.invoice, trxId:r.trxId, sender:r.sender, paidAt:r.paidAt };
    const html = `
      <p>${t('okMsg')(r.amount)}</p>
      <div class="rcpt">
        <div><span>${t('rMethod')}</span><b>${esc(r.method)}</b></div>
        <div><span>${t('rAmount')}</span><b>${esc(r.amount)} BDT</b></div>
        <div><span>${t('rInvoice')}</span><b>${esc(state.invoice)}</b></div>
        <div><span>${t('rSender')}</span><b>${esc(r.sender)}</b></div>
        <div><span>${t('rTrx')}</span><b>${esc(r.trxId)}</b></div>
        <div><span>${t('rTime')}</span><b>${esc(r.paidAt)}</b></div>
        <div><span>${t('rStatus')}</span><b class="st">${t('completed')}</b></div>
      </div>
      <div class="rc-btns">
        <button class="rc-go" id="rcGo">${t('goSite')}</button>
        <button class="rc-dl" id="rcDl">${t('dlReceipt')}</button>
      </div>`;
    dialog({type:'success', title:t('paySuccess'), html, ok:false, dismiss:false}).then(goWebsite);
    $('rcGo').onclick = () => window._dlgClose();
    $('rcDl').onclick = async e => {
      const b = e.currentTarget; if (b.disabled) return;
      btnLoad(b);
      try { await downloadReceipt(); } catch(err){ console.error(err); }
      btnDone(b);
    };
  } else {
    const title = r.code === 'USED' ? t('failed') : t('invalid');
    if (r.code === 'LOCKED' || r.left === 0) return lockVerify();
    alertError(title, t(r.code) || r.msg).then(() => $('trxInput').focus());
  }
}
let LAST = null;

async function drawReceipt(d){
  const W = 1240, H = 1754, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d'), F = "'Hind Siliguri','Poppins','Segoe UI',Arial,sans-serif";
  try { await Promise.all(['500','600','700'].map(w => document.fonts.load(w + ' 32px "Hind Siliguri"'))); await document.fonts.load('600 32px "Poppins"'); } catch(e){}
  g.fillStyle = '#fff'; g.fillRect(0,0,W,H);
  g.fillStyle = '#1e6fe8'; g.fillRect(0,0,W,16);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#1558c0'; g.font = '700 58px ' + F; g.fillText(SITE.name, W/2, 110);
  g.fillStyle = '#94a3b8'; g.font = '500 28px ' + F; g.fillText(t('rcTitle'), W/2, 165);

  g.fillStyle = '#22c55e'; g.beginPath(); g.arc(W/2, 320, 82, 0, Math.PI*2); g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 16; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(W/2-34, 322); g.lineTo(W/2-8, 350); g.lineTo(W/2+38, 292); g.stroke();
  g.fillStyle = '#16a34a'; g.font = '700 58px ' + F; g.fillText(t('paySuccess'), W/2, 470);
  g.fillStyle = '#64748b'; g.font = '500 30px ' + F; g.fillText(t('okMsg')(d.amount), W/2, 535);
  const rows = [
    [t('rMethod'), d.method], [t('rAmount'), d.amount + ' BDT'], [t('rInvoice'), d.invoice],
    [t('rSender'), d.sender], [t('rTrx'), d.trxId], [t('rTime'), d.paidAt], [t('rStatus'), t('completed')]
  ];
  const x0 = 110, x1 = W - 110, rh = 96; let y = 620;
  g.strokeStyle = '#e2e8f0'; g.lineWidth = 2;
  rows.forEach(([k,v], i) => {
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
    g.textAlign = 'left'; g.fillStyle = '#1e293b'; g.font = '700 32px ' + F; g.fillText(k, x0 + 34, y + rh/2);
    g.textAlign = 'right'; g.fillStyle = i === rows.length-1 ? '#16a34a' : '#475569'; g.font = '500 32px ' + F; g.fillText(String(v), x1 - 34, y + rh/2);
    y += rh;
  });
  g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
  g.textAlign = 'center'; g.fillStyle = '#94a3b8'; g.font = '500 26px ' + F; g.fillText(t('rcGen'), W/2, y + 90);
  return cv;
}
function pdfFromCanvas(cv){
  const b64 = cv.toDataURL('image/jpeg', 0.92).split(',')[1], bin = atob(b64), img = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) img[i] = bin.charCodeAt(i);
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = u8 => { parts.push(u8); len += u8.length; };
  const str = s => push(enc.encode(s));
  const obj = (n, body) => { offs[n] = len; str(n + ' 0 obj\n' + body + '\nendobj\n'); };
  str('%PDF-1.4\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>');
  const cs = 'q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  obj(4, '<< /Length ' + cs.length + ' >>\nstream\n' + cs + '\nendstream');
  offs[5] = len;
  str('5 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + cv.width + ' /Height ' + cv.height + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + img.length + ' >>\nstream\n');
  push(img); str('\nendstream\nendobj\n');
  const xr = len; let x = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  str(x + 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF');
  return new Blob(parts, {type:'application/pdf'});
}
async function downloadReceipt(){
  if (!LAST) return;
  const blob = pdfFromCanvas(await drawReceipt(LAST)), url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'Receipt-' + LAST.invoice + '.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

function goWebsite(){
  const url = INV && ((PAID ? INV.success_url : INV.cancel_url) || INV.website_url);
  if (url && /^https?:\/\//i.test(url)) location.href = url; else resetAll();
}

  state.method=''; state.sender=''; TAB='mobile';
  $('phoneInput').value=''; $('trxInput').value=''; $('gwOk').disabled=true;
  if (INV){ state.invoice=INV.invoice_id; state.amount=INV.amount; }

applyLang();

  return new Date(v).toLocaleString('en-GB', { timeZone:'Asia/Dhaka', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true }).replace(/\b(am|pm)\b/i, m => m.toUpperCase());
}

applySite();
(async function init(){
  const fatal = (title, text) => dialog({type:'error', title, text, ok:false, dismiss:false});
  let j = null;
  try { j = await API.load(); } catch (e) {}
  if (!j || !j.success) return fatal('Invoice not found', 'This payment link is invalid.');
  INV = j.data;
  SITE.name = INV.site_name || ''; SITE.logo = INV.logo_url || ''; SUPPORT = INV.support || SUPPORT; applySite();
  if (INV.status === 'completed') return fatal('Already paid', 'This payment is already completed.');
  if (INV.status === 'expired') return fatal('Expired', 'This invoice has expired.');
  if (INV.status === 'cancelled') return fatal('Cancelled', 'This invoice was cancelled.');
  state.amount = INV.amount; state.invoice = INV.invoice_id;
  fillText(); $('payBdt').textContent = Number(INV.amount).toFixed(2);
  all('#methodsGrid .pay-card').forEach(c => {
    const id = M2ID[c.querySelector('img').alt];
    const ok = INV.available_methods.some(m => m.id === id) && (!INV.payment_method || INV.payment_method === id);
    if (!ok) c.classList.add('hidden');
  });
  show('s3');
  if (INV.attempts_left === 0) lockVerify();
  if (INV.payment_method) {
    const label = Object.keys(M2ID).find(k => M2ID[k] === INV.payment_method);
    if (label) pickMethod(label);
  }
})();
